name: Setup
description: pnpm, the pinned Node and the locked dependencies
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v2
      with:
        version: 10

    - uses: actions/setup-node@v4
      with:
        node-version: "24.22.1"
        cache: "pnpm"

    - name: Install
      shell: bash
      run: pnpm install --frozen-lockfile
