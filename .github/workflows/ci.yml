name: ci
on:
  push:
jobs:
  build-and-check:
    permissions:
      contents: read
      deployments: write
      pull-requests: write

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v2
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Playwright runs in e2e.yml.
      - name: Durable Object tests
        run: pnpm exec vitest run

      - name: Deploy
        id: deploy
        run: pnpm release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

      - name: Create GitHub Preview Deployment
        if: github.ref_name != 'main' && steps.deploy.outcome == 'success'
        uses: chrnorm/deployment-action@v2
        with:
          token: "${{ github.token }}"
          environment-url: https://${{ env.DEPLOYMENT_URL }}
          environment: Preview
          production-environment: false
          initial-status: success

      - name: Create GitHub Production Deployment
        if: github.ref_name == 'main'
        uses: chrnorm/deployment-action@v2
        with:
          token: "${{ github.token }}"
          environment-url: https://${{ env.DEPLOYMENT_URL }}
          environment: Production
          production-environment: true
          initial-status: success
