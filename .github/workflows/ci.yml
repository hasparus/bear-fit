name: ci
# Pull requests (so the coverage comment can post) and pushes to main; a
# branch without a PR isn't checked or deployed.
on:
  push:
    branches: [main]
  pull_request:

# `check` and `e2e` run in parallel; `deploy` waits for both.
jobs:
  check:
    permissions:
      contents: read

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Durable Object tests
        run: pnpm exec vitest run

  e2e:
    permissions:
      contents: read
      pull-requests: write

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: "pnpm"

      # Specs sign dashboard challenges with `bun .ssh/sign-message.tsx`.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Install
        run: pnpm install --frozen-lockfile

      # Split system deps from the browser download: the combined
      # `--with-deps` wedges on the interactive `needrestart` apt prompt.
      - name: Install Playwright system deps
        run: pnpm exec playwright install-deps chromium firefox
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium firefox
        timeout-minutes: 5

      # Builds the app, then runs Playwright against the built output served
      # by `vite preview`. playwright.config.ts writes the committed test
      # public key to .dev.vars, which the Worker loads for dashboard auth.
      - name: Run Playwright tests
        run: pnpm test:e2e

      - name: Generate coverage report
        if:
          always() && github.event.pull_request.head.repo.full_name ==
          github.repository
        run: pnpm test:coverage-report

      - name: Install lcov
        if:
          always() && github.event.pull_request.head.repo.full_name ==
          github.repository
        run: sudo apt-get install -y lcov

      - name: Report code coverage
        if:
          always() && github.event.pull_request.head.repo.full_name ==
          github.repository
        uses: zgosalvez/github-actions-report-lcov@v4
        with:
          coverage-files: test/coverage/html/lcov.info
          minimum-coverage: 65
          artifact-name: code-coverage-report
          github-token: ${{ secrets.GITHUB_TOKEN }}
          update-comment: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/p
          retention-days: 30

  deploy:
    needs: [check, e2e]
    # Fork PRs get no secrets, so they can't deploy.
    if:
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      deployments: write

    runs-on: ubuntu-latest
    steps:
      # The branch head, not the PR's merge commit, like the preview's name.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@v2
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Deploy
        id: deploy
        run: pnpm release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

      - name: Create GitHub Preview Deployment
        if: github.ref_name != 'main' && steps.deploy.outcome == 'success'
        uses: chrnorm/deployment-action@v2
        with:
          token: "${{ github.token }}"
          environment-url: https://${{ env.DEPLOYMENT_URL }}
          environment: Preview
          production-environment: false
          initial-status: success

      - name: Create GitHub Production Deployment
        if: github.ref_name == 'main'
        uses: chrnorm/deployment-action@v2
        with:
          token: "${{ github.token }}"
          environment-url: https://${{ env.DEPLOYMENT_URL }}
          environment: Production
          production-environment: true
          initial-status: success
