name = "bear-fit"
main = "party/worker.ts"
compatibility_date = "2024-10-01"

# `/` runs the Worker first, so link-preview crawlers get calendar meta tags.
assets = { directory = "./public", binding = "ASSETS", run_worker_first = ["/"] }

# Workers Logs: keeps request logs queryable after the fact, not just in `wrangler tail`.
[observability]
enabled = true

# .dev.vars overrides these locally with the test key (see playwright.config.ts).
[vars]
PUBLIC_KEY_B64 = "EOeE/T5LX+j95y0pZ8ThZBwyLL4RzlUDdpLcRQMHetE="

[[durable_objects.bindings]]
name = "main"
class_name = "EditorPartyServer"

[[durable_objects.bindings]]
name = "rooms"
class_name = "OccupancyPartyServer"


[[migrations]]
tag = "v1"
new_sqlite_classes = ["EditorPartyServer", "OccupancyPartyServer"]
